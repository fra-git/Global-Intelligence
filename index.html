<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Intelligence Archive</title>
<style>
:root { --bg:#f7f8fa; --card:#fff; --ink:#1f2937; --muted:#6b7280; --navy:#13294b;
        --accent:#c2410c; --rule:#e5e7eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f141b; --card:#171e27; --ink:#e5e7eb; --muted:#9ca3af; --navy:#8fb3ff;
          --accent:#fb923c; --rule:#263241; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding:28px 16px 12px; max-width:860px; margin:auto; }
h1 { margin:0 0 4px; font-size:24px; color:var(--navy); }
.sub { color:var(--muted); font-size:14px; }
#q { width:100%; margin-top:14px; padding:11px 14px; font-size:16px; border-radius:10px;
     border:1px solid var(--rule); background:var(--card); color:var(--ink); }
.filters { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
.filters button { border:1px solid var(--rule); background:var(--card); color:var(--ink);
     padding:5px 12px; border-radius:999px; cursor:pointer; font-size:13px; }
.filters button.on { background:var(--navy); color:var(--bg); border-color:var(--navy); }
main { max-width:860px; margin:auto; padding:0 16px 40px; }
h2.month { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
           margin:26px 0 8px; }
.card { background:var(--card); border:1px solid var(--rule); border-radius:12px;
        padding:14px 16px; margin-bottom:10px; }
.top { display:flex; justify-content:space-between; gap:12px; align-items:baseline;
       flex-wrap:wrap; }
.top a { font-weight:600; color:var(--navy); text-decoration:none; font-size:16px; }
.tag { font-size:12px; color:var(--accent); font-weight:600; }
.top a.ph { font-size:13px; font-weight:500; }
.meta { color:var(--muted); font-size:13px; }
details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:6px; }
ul { margin:6px 0 0; padding-left:18px; }
li { margin-bottom:4px; font-size:14px; }
mark { background:#fde68a; color:#111; border-radius:3px; }
.empty { color:var(--muted); text-align:center; padding:40px 0; }
</style></head><body>
<header>
  <h1>Global Intelligence Archive</h1>
  <div class="sub">1 reports · search across front pages and every story headline</div>
  <input id="q" type="search" placeholder="Search: Ukraine, ECB, Meloni, Taiwan, lithium…"
         autocomplete="off">
  <div class="filters" id="filters">
    <button data-e="" class="on">All</button><button data-e="DAILY">Daily</button>
    <button data-e="EVENING">Evening</button><button data-e="WEEKLY">Weekly</button>
  </div>
</header>
<main id="list"></main>
<script>
const DATA = [{"date": "2026-11-02", "edition": "DAILY", "title": "Daily Intelligence Report", "pages": 27, "pdf": "reports/2026-11-02/DAILY.pdf", "phone": "reports/2026-11-02/DAILY-phone.pdf", "summary": ["Iran offers to reopen Hormuz, and oil and gas fall: Tehran says it could reopen the Strait within two days if Washington accepts its demands. That is a statement of willingness, not a reopening, and the closure continues. Brent fell more than 3% to about $109 and Dutch TTF gas fell below €100/MWh. The war is in its ninth month, and ship attacks go on.", "US midterms on Tuesday 3 November: All 435 House seats and about a third of the Senate are up. Polls cited by Bloomberg favour the Democrats. The administration has pre-positioned legal challenges, and Trump floated pardons for Musk and aides. European diplomats fear troop or NATO funding cuts after a loss. That is a fear, not a decision.", "ECB tilts towards more hikes: It held the deposit rate at 2.50% on 29 October, after a September hike. Governing Council member Kazimir says markets may underestimate the tightening needed. September inflation was 3.8%, and the October flash estimate is due Wednesday. Lagarde is reported to be leaving on 7 February 2027.", "Italy's 2027 budget goes to the Chamber: It is the last budget before the 2027 election. It depends on Brussels accepting a €29bn deficit deviation over 2027-28. The BTP-Bund spread eased to about 116 basis points.", "Record crypto theft at Binance: The FBI blames North Korea's TraderTraitor group for more than $6.3bn stolen. Net outflows reached $4.7bn. Binance says it will cover 90% of losses.", "Russia-Ukraine talks in Abu Dhabi: US, Ukrainian and Russian negotiators are expected to meet on 6-10 November. Moscow says restoring gas transit through Ukraine is \"not possible\" now. Strikes on energy sites continue on both sides.", "Supermarket freezer hacks spread: Suspected cyberattacks pushed freezer temperatures up to 50C in six European countries. France was hit weeks ago. Nobody has been blamed.", "AI funding strain: The Nasdaq 100 fell 3.46% on Friday. Marvell agreed a $115bn all-stock deal for Lumentum. Oracle and Alphabet are selling bonds, and Alphabet is paying higher yields than in May.", "France under stress: Protests entered a third weekend, and Alstom fell 28% on a second profit warning. ECB board member Makhlouf ruled out ECB support for French debt.", "China's export engine stumbles: October factory data showed weak exporters, which raises the pressure for stimulus. Chinese chemical output has almost doubled in five years, opening a possible new trade front with Europe."], "headlines": ["Budget bill reaches the Chamber as the fiscal fight with Brussels looms", "Budget measures on public-sector pay and the cost of living", "Opposition: aligned on welfare, split on Ukraine", "Space and energy", "ECB under pressure over energy-driven inflation, with Lagarde leaving", "ECB rules out shoring up French debt", "EU-Canada summit launches \"associate membership\"", "Supermarket freezers hit by suspected cyberattack", "PNRR tracker", "France", "Germany", "Bulgaria", "Poland", "United Kingdom", "Trump's DOJ sues over voting; fears of post-election fights grow", "Oil eases on Iran diplomacy report; Fed hike talk and Treasury overhaul loom", "Exports falter at the start of Q4", "Xi courts Oman on Hormuz and tells Europe there is no Ukraine trilateral", "Talks planned in Abu Dhabi; gas transit \"not possible\" for now", "Energy war and cyberattacks on alert apps", "Iran signals it could reopen Hormuz; oil and gas retreat", "Xi hosts Oman's sultan; Gulf fears Iranian retaliation", "Israel: election deadlock, Hebron pullout reported", "Record North Korean crypto hack hits Binance", "Japan weighs a $500 billion defence plan", "Energy shock reshapes Asia", "Energy shock splits winners from losers", "Uganda starts leaving Somalia after 20 years", "Investment and economy", "Background on Sudan", "Chile's Kast hits record-low approval", "Venezuela: patience for Machado", "Brazil and Italy-linked news", "Ukraine hits a Russian pumping station as the gas-transit question reopens", "Russia strains to pay its army; Poland's border region lives under sirens", "Iran diplomacy and Gulf nerves", "Budgets and industry", "Record Binance theft attributed to North Korea", "Supermarket freezers hit again across Europe", "Alert apps hacked in Ukraine and Russia", "The claim: \"There is radiation in Kyiv\" and chemical attacks (alerts on Ukraine's Air Alert app, 1 November)", "The claim: a hacker group called \"Hitcore\" is behind the Ukrainian app hack", "Marvell to buy Lumentum for $115bn in AI optics deal", "Investors weigh the cost of the AI build-out", "Pentagon dependence on Big Tech, and Hong Kong chip listings", "Ryanair-Starlink row", "Canada's Starlink rival depends on Musk's rockets", "Italy pushes space diplomacy and a new private astronaut mission", "ECB signals a December hike while telling France to fix its own finances", "Fed on hold with hawkish dissent; Bank of England and US jobs data are next", "Tech reset and a flight to Apple", "Crypto: Binance theft", "Company moves", "China's chemical export surge opens a possible new trade front", "Background: US tariffs after the Supreme Court", "Russia's budget strain", "Oil and gas fall on hopes of an Iran deal, but the shock persists", "LNG buyers scramble", "Metals", "Energy and the Iran headline trade", "Rate hikes, bonds and BTPs", "AI infrastructure after the shake-out", "Italian banks and cyclicals", "Crypto", "Investing basics: duration", "Hormuz and the Iran talks", "US midterms and the aftermath", "ECB and Italy's budget", "Deficit deviation (the €29bn margin)", "The BTP-Bund spread", "Why oil shocks push central banks to hike", "How crypto laundering works"]}];
const list = document.getElementById("list"), q = document.getElementById("q");
let edition = "";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = (s, terms) => terms.reduce((t, w) =>
  t.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"),
            "<mark>$1</mark>"), esc(s));
function render() {
  const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let month = "", html = "";
  for (const r of DATA) {
    if (edition && r.edition !== edition) continue;
    const hay = (r.summary.join(" ") + " " + r.headlines.join(" ")).toLowerCase();
    if (!terms.every(t => hay.includes(t))) continue;
    const m = new Date(r.date + "T12:00:00").toLocaleDateString("en-GB",
              {month: "long", year: "numeric"});
    if (m !== month) { html += `<h2 class="month">${m}</h2>`; month = m; }
    const d = new Date(r.date + "T12:00:00").toLocaleDateString("en-GB",
              {weekday: "short", day: "numeric", month: "short"});
    const hits = terms.length ? r.headlines.filter(h => terms.some(t => h.toLowerCase().includes(t))) : [];
    html += `<div class="card"><div class="top"><a href="${r.pdf}">${esc(r.title)} — ${d}</a>
      <span class="meta"><span class="tag">${r.edition}</span>${r.pages ? " · " + r.pages + " pages" : ""}${r.phone ? ` · <a class="ph" href="${r.phone}">phone version</a>` : ""}</span></div>
      ${hits.length ? "<ul>" + hits.slice(0, 6).map(h => "<li>" + hl(h, terms) + "</li>").join("") + "</ul>" : ""}
      ${r.summary.length ? `<details><summary>Front page</summary><ul>` +
        r.summary.map(s => "<li>" + hl(s, terms) + "</li>").join("") + "</ul></details>" : ""}</div>`;
  }
  list.innerHTML = html || '<p class="empty">No reports match.</p>';
}
q.addEventListener("input", render);
document.getElementById("filters").addEventListener("click", e => {
  if (!e.target.dataset || e.target.dataset.e === undefined) return;
  edition = e.target.dataset.e;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b === e.target));
  render();
});
render();
</script></body></html>
