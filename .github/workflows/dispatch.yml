name: Intelligence Dispatch

# Two sessions a day, starting at 05:50 and 20:50 Italian time (Europe/Rome),
# right when the owner's Claude Pro usage window resets:
#   AM -> Daily Intelligence Report (Weekly Deep-Dive on Sundays), PM -> Evening Update.
#
# Primary trigger: an external scheduler (cron-job.org) calls this workflow's
# workflow_dispatch API at the exact minute (see README, "Exact timing").
# Backup trigger: GitHub's own cron below, which can run hours late under load.
# Whichever arrives second finds the session already delivered and sends nothing.
#
# GitHub cron is UTC-only and ignores daylight saving, so each session has two
# triggers (summer CEST = UTC+2, winter CET = UTC+1); the `gate` job lets only
# the one matching Italy's current offset proceed.
on:
  schedule:
    - cron: "50 3 * * *"    # AM, summer: 05:50 CEST
    - cron: "50 4 * * *"    # AM, winter: 05:50 CET
    - cron: "50 18 * * *"   # PM, summer: 20:50 CEST
    - cron: "50 19 * * *"   # PM, winter: 20:50 CET
  workflow_dispatch:
    inputs:
      edition:
        description: "AM (daily, weekly on Sundays) | PM (evening) | DAILY | EVENING | WEEKLY | auto"
        default: auto
      send:
        description: "Post to Telegram"
        type: boolean
        default: true
      force:
        description: "Send even if this session was already delivered today"
        type: boolean
        default: false

concurrency:
  group: intelligence-dispatch
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.gate.outputs.go }}
      edition: ${{ steps.gate.outputs.edition }}
    steps:
      - name: Resolve session and daylight-saving pair
        id: gate
        run: |
          case "${{ github.event.schedule }}" in
            "50 3 * * *")  D=AM; OFF=2 ;;
            "50 4 * * *")  D=AM; OFF=1 ;;
            "50 18 * * *") D=PM; OFF=2 ;;
            "50 19 * * *") D=PM; OFF=1 ;;
            *)             D="${{ inputs.edition || 'auto' }}"; OFF="" ;;
          esac
          echo "edition=$D" >> "$GITHUB_OUTPUT"
          if [ -z "$OFF" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CUR=$(TZ=Europe/Rome date +%z)   # +0200 in summer, +0100 in winter
          if [ "$CUR" = "+0${OFF}00" ]; then GO=true; else GO=false; fi
          echo "Europe/Rome is UTC$CUR; trigger is for UTC+$OFF -> go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Restore cross-dispatch state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}
          restore-keys: briefing-state-

      - name: Generate and send
        env:
          # Claude Pro subscription token from `claude setup-token` (no API billing).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL || 'sonnet' }}
          BRIEFING_EFFORT: ${{ vars.BRIEFING_EFFORT || 'high' }}
          BRIEFING_PARALLEL_DESKS: ${{ vars.BRIEFING_PARALLEL_DESKS || '3' }}
          BRIEFING_SEARCH_SCALE: ${{ vars.BRIEFING_SEARCH_SCALE || '1' }}
          BRIEFING_TZ: Europe/Rome
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send }}" != "true" ]; then FLAGS="$FLAGS --no-send"; fi
            if [ "${{ inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          fi
          python -m briefing -v run "${{ needs.gate.outputs.edition }}" $FLAGS

      - name: Save cross-dispatch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}

      - name: Upload briefing archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: archive/
          retention-days: 90
          if-no-files-found: ignore
