name: Intelligence Dispatch

# Two sessions a day, starting at 05:50 and 20:50 Italian time (Europe/Rome),
# right when the owner's Claude Pro usage window resets. Briefings are sent as
# soon as they are ready (~10–20 min later, plus GitHub's cron lag).
# GitHub cron is UTC-only and ignores daylight saving, so each session has two
# triggers (summer CEST = UTC+2, winter CET = UTC+1); the `gate` job lets only
# the one matching Italy's current offset proceed.
on:
  schedule:
    - cron: "50 3 * * *"    # AM, summer: 05:50 CEST
    - cron: "50 4 * * *"    # AM, winter: 05:50 CET
    - cron: "50 18 * * *"   # PM, summer: 20:50 CEST
    - cron: "50 19 * * *"   # PM, winter: 20:50 CET
  workflow_dispatch:
    inputs:
      dispatch:
        description: "AM | PM | AM_PART_1 | AM_PART_2 | PM_PART_1 | PM_PART_2 | auto"
        default: auto
      send:
        description: "Post to Telegram"
        type: boolean
        default: true

concurrency:
  group: intelligence-dispatch
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      dispatch: ${{ steps.gate.outputs.dispatch }}
    steps:
      - name: Resolve session and daylight-saving pair
        id: gate
        run: |
          case "${{ github.event.schedule }}" in
            "50 3 * * *")  D=AM; OFF=2 ;;
            "50 4 * * *")  D=AM; OFF=1 ;;
            "50 18 * * *") D=PM; OFF=2 ;;
            "50 19 * * *") D=PM; OFF=1 ;;
            *)             D="${{ inputs.dispatch || 'auto' }}"; OFF="" ;;
          esac
          echo "dispatch=$D" >> "$GITHUB_OUTPUT"
          if [ -z "$OFF" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CUR=$(TZ=Europe/Rome date +%z)   # +0200 in summer, +0100 in winter
          if [ "$CUR" = "+0${OFF}00" ]; then GO=true; else GO=false; fi
          echo "Europe/Rome is UTC$CUR; trigger is for UTC+$OFF -> go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Restore cross-dispatch state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}
          restore-keys: briefing-state-

      - name: Generate and send
        env:
          # Claude Pro subscription token from `claude setup-token` (no API billing).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL || 'sonnet' }}
          BRIEFING_EFFORT: ${{ vars.BRIEFING_EFFORT || 'high' }}
          BRIEFING_TZ: Europe/Rome
        run: |
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send }}" != "true" ]; then
            MODE="--no-send"
          fi
          python -m briefing -v run "${{ needs.gate.outputs.dispatch }}" $MODE

      - name: Save cross-dispatch state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}

      - name: Upload briefing archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: archive/
          retention-days: 90
          if-no-files-found: ignore
