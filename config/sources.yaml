# Source registry.
#
# allowed_domains: whitelist for Claude Code's web tools.
#   WebFetch is hard-restricted to these (permission rules; anything else is denied).
#   WebSearch is instructed to rely only on results from these domains.
#   Subdomains are covered (europa.eu covers ecb.europa.eu, ec.europa.eu, eur-lex...).
#
# feeds: RSS/Atom feeds ingested before each edition as seed context.
#   tags: regions  it | eu | us | cn | ru | me (Middle East) | ip (Indo-Pacific) | af | la | brics
#         topics   defence | cyber | tech | space | energy | econ
#   Items are also tagged automatically from their headline; feed tags are added on top
#   (e.g. everything from an Italian outlet is tagged "it"). Tags route items to desks.
#   Some publishers block automated readers (IMF, Bruegel, ECFR, CSIS); they stay
#   reachable through web research via allowed_domains.
#   Feed URLs change without notice — run `python -m briefing check-feeds` to verify.
#   A dead feed is logged and skipped; it never fails an edition.

allowed_domains:
  # Tier-1 financial and general news
  - ft.com
  - bloomberg.com
  - reuters.com
