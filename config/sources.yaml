# Tier-1 source registry.
#
# allowed_domains: Tier-1 whitelist for Claude Code's web tools.
#   WebFetch is hard-restricted to these (permission rules; anything else is denied).
#   WebSearch is instructed to rely only on results from these domains.
#   Subdomains are covered (europa.eu covers ecb.europa.eu, ec.europa.eu, eur-lex...).
#
# feeds: RSS/Atom feeds ingested before each dispatch as seed context.
#   pillars: macro | geo | tech | space | energy  (routes items to Part 1 / Part 2)
#   Feed URLs change without notice — run `python -m briefing check-feeds` to verify.
#   A dead feed is logged and skipped; it never fails a dispatch.

allowed_domains:
  # Tier-1 financial
  - ft.com
  - bloomberg.com
  - reuters.com
  - wsj.com
  - nikkei.com
  - handelsblatt.com
  # Tier-1 geopolitics / defense
  - defenseone.com
  - spacenews.com
  - c4isrnet.com
  - warontherocks.com
  # Official institutions
  - europa.eu          # EU Commission, ECB, Council, EUR-Lex
  - federalreserve.gov
  - bis.org
  - imf.org
  - esa.int
  - spacechina.com     # CASC
  # Official institutions: US
  - treasury.gov       # incl. OFAC sanctions
  - commerce.gov
  - bis.gov            # US Bureau of Industry and Security (export controls)
  - ustr.gov
  - whitehouse.gov
  - defense.gov
  # Official institutions: China
  - gov.cn             # State Council (english.www.gov.cn)
  - pbc.gov.cn
  - mofcom.gov.cn
  - stats.gov.cn
  # Official institutions: Russia (official rhetoric / CBR decisions only)
  - cbr.ru
  - kremlin.ru
  # Official institutions: BRICS+
  - ndb.int            # New Development Bank
  - rbi.org.in
  - bcb.gov.br
  # Think tanks
  - bruegel.org
  - csis.org
  - iiss.org

feeds:
  # --- Tier-1 financial ---
  - name: Bloomberg Markets
    url: https://feeds.bloomberg.com/markets/news.rss
    pillars: [macro]
  - name: Bloomberg Politics
    url: https://feeds.bloomberg.com/politics/news.rss
    pillars: [geo]
  - name: Bloomberg Technology
    url: https://feeds.bloomberg.com/technology/news.rss
    pillars: [tech]
  - name: FT World
    url: https://www.ft.com/world?format=rss
    pillars: [geo]
  - name: FT Markets
    url: https://www.ft.com/markets?format=rss
    pillars: [macro]
  - name: FT Technology
    url: https://www.ft.com/technology?format=rss
    pillars: [tech]
  - name: WSJ World
    url: https://feeds.a.dj.com/rss/RSSWorldNews.xml
    pillars: [geo]
  - name: WSJ Markets
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    pillars: [macro]
  - name: Nikkei Asia
    url: https://asia.nikkei.com/rss/feed/nar
    pillars: [geo, tech]
  - name: Handelsblatt
    url: https://www.handelsblatt.com/contentexport/feed/schlagzeilen
    pillars: [macro, energy]
  # --- Global axis (US / China / Russia / BRICS+) ---
  - name: Bloomberg Economics
    url: https://feeds.bloomberg.com/economics/news.rss
    pillars: [macro, geo]
  - name: FT US
    url: https://www.ft.com/us?format=rss
    pillars: [geo, macro]
  - name: FT China
